default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]
minimum_pre_commit_version: "3.2.0"

repos:
  # Shared file and repository hygiene hooks. The revision is pinned to the
  # immutable commit for pre-commit-hooks v6.0.0.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: detect-private-key

  # Commit messages run in their own stage. The wrapper revision is pinned to
  # the immutable commit for commitlint-pre-commit-hook v9.27.0.
  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: 1f1ac45c93d1c2ce36b71330252c489a5f4f2724 # v9.27.0
    hooks:
      - id: commitlint
        stages: [commit-msg]
        pass_filenames: true
        always_run: true
        additional_dependencies:
          - "@commitlint/cli@21.2.3"
          - "@commitlint/config-conventional@21.2.3"

  # Keystone's Go module is at the repository root. Formatting receives the
  # matching staged Go paths; vet and test intentionally validate the module
  # once for every pre-commit invocation.
  - repo: local
    hooks:
      - id: gofmt
        name: gofmt
        entry: gofmt -w
        language: system
        types: [go]
        pass_filenames: true
      - id: go-vet
        name: go vet
        entry: go vet -mod=readonly ./...
        language: system
        pass_filenames: false
        require_serial: true
        always_run: true
      - id: go-test
        name: go test
        entry: go test -mod=readonly ./...
        language: system
        pass_filenames: false
        require_serial: true
        always_run: true
